<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Gym Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: phone-first single column, sticky header, fixed bottom tab bar; cards only for exercises. Chalkboard-and-iron palette. */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --sunk:#E3E6EA; --line:#D3D8DE;
  --ink:#14171C; --muted:#5D6672; --accent:#2F52E0; --accent-ink:#FFFFFF; --accent-soft:#DFE5FC;
  --plate:#B87800; --good:#1E8A4C; --warn:#B86A00; --bad:#C0392B;
  --ghost:#9AA3AE;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1116; --surface:#171B22; --sunk:#1F242C; --line:#2A313B;
  --ink:#E8EBEF; --muted:#98A2AE; --accent:#7D95FF; --accent-ink:#0E1116; --accent-soft:#1F2A52;
  --plate:#F0B53A; --good:#4CC384; --warn:#F0A43A; --bad:#FF7A6B; --ghost:#5C6672; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#171B22; --sunk:#1F242C; --line:#2A313B;
  --ink:#E8EBEF; --muted:#98A2AE; --accent:#7D95FF; --accent-ink:#0E1116; --accent-soft:#1F2A52;
  --plate:#F0B53A; --good:#4CC384; --warn:#F0A43A; --bad:#FF7A6B; --ghost:#5C6672; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font:16px/1.45 var(--f-body);margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
.brand{font:700 26px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand span{color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:34px;font-weight:700;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
h2{font-size:22px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.eyebrow{font:600 12px/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
section.view{display:flex;flex-direction:column;gap:22px;padding-top:18px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{padding:11px 16px;border-radius:10px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:14px;border-radius:8px}
.daypick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.daypick button{flex:0 0 auto;padding:8px 12px;border-radius:8px;background:var(--sunk);font:600 15px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.daypick button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* shadow panel */
.shadow{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.shadow .k{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.shadow .v{font:700 26px/1.1 var(--f-display)}
.shadow .say{grid-column:1/-1;font-size:15px;border-top:1px solid color-mix(in srgb,var(--bg) 20%,transparent);padding-top:10px}
/* exercises */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ex.ss{margin-top:-6px;border-top-left-radius:0;border-top-right-radius:0}
.ex.lead{border-bottom-left-radius:0;border-bottom-right-radius:0}
.ex>button.head{width:100%;text-align:left;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.ex .name{font-weight:700;font-size:17px;min-width:0}
.ex .tgt{font:500 14px var(--f-num);color:var(--muted);grid-row:1/3;grid-column:2;text-align:right}
.ex .last{font-size:13px;color:var(--muted);min-width:0}
.ex .ssTag{font:600 11px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:6px}
.ex.complete .name::after{content:" ✓";color:var(--good)}
.ex .body{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px}
.sugg{font-size:14px;background:var(--accent-soft);color:var(--ink);padding:8px 10px;border-radius:8px}
.sugg b{color:var(--accent)}
.note{font-size:13px;color:var(--muted)}
.set{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.set .lbl{font:600 13px var(--f-num);color:var(--muted)}
.set input{width:100%;min-width:0;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 16px var(--f-num)}
.set input::placeholder{color:var(--ghost)}
.tick{height:42px;border-radius:8px;background:var(--sunk);font-weight:700;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--good);color:#fff}
.cardio{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cardio input{width:90px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 16px var(--f-num)}
/* rest timer */
.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:10px 18px;display:flex;gap:14px;align-items:center;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.timer .num{font-size:20px}
/* forms */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
label.f input,label.f select{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 16px var(--f-num);min-width:0;width:100%}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:2px solid var(--ink)}
.tile .k{font:600 11px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:700 24px/1.1 var(--f-display)}
.tile .s{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font:600 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:999px}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.chart{width:100%;overflow-x:auto}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px;border-radius:2px}
table.hist{width:100%;border-collapse:collapse;font-size:14px}
table.hist th{text-align:left;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 4px;border-bottom:1px solid var(--line)}
table.hist td{padding:7px 4px;border-bottom:1px solid var(--line);font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
/* diet */
.meal{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.meal .box{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:#fff}
.meal[aria-pressed="true"] .box{background:var(--good);border-color:var(--good)}
.meal[aria-pressed="true"] .txt{color:var(--muted);text-decoration:line-through}
.meal .when{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block}
.water{display:flex;gap:4px}
.water i{flex:1;height:26px;border-radius:4px;background:var(--sunk)}
.water i.on{background:var(--accent)}
/* plan */
.phase{border-left:3px solid var(--line);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.phase.cur{border-color:var(--accent)}
.phase ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
details.dayx summary{cursor:pointer;font-weight:700;padding:6px 0}
details.dayx ol{margin:4px 0 8px;padding-left:20px;font-size:14px}
.lessons{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{padding:12px 0 14px;font:600 16px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.status{font-size:12px;color:var(--muted)}
.onboard{background:var(--accent-soft);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
#weekChip{overflow:hidden;text-overflow:ellipsis;min-width:0;max-width:52vw}
.micbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 14px/1 var(--f-body);flex:0 0 auto}
.micbtn[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:9;background:color-mix(in srgb,var(--ink) 40%,transparent);display:flex;align-items:flex-end}
.sheet-in{background:var(--surface);width:100%;max-width:640px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow-y:auto}
.sheet textarea{width:100%;min-height:110px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);resize:vertical}
.logged{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:15px}
.logged li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:8px}
.logged li::before{content:"✓";color:var(--good);font-weight:700}
.macro{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.bar.over>i{background:var(--warn)}
.slot{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.slot .when{font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slot .plan{font-size:15px;min-width:0}
.slot.ate .plan{color:var(--muted);text-decoration:line-through}
.slot .k{font:500 12px var(--f-num);color:var(--muted);white-space:nowrap}
.food{display:flex;justify-content:space-between;gap:10px;font-size:14px;background:var(--sunk);border-radius:8px;padding:7px 10px}
.food .k{white-space:nowrap}
.food button{color:var(--muted);font-size:13px}
.inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.inline input{min-width:0;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:15px var(--f-body)}
.seg{display:flex;gap:6px;overflow-x:auto}
.seg button{flex:0 0 auto;padding:7px 11px;border-radius:8px;background:var(--sunk);color:var(--muted);font:600 14px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
@media (prefers-reduced-motion:no-preference){.ex .body{animation:fade .18s ease-out}@keyframes fade{from{opacity:.4;transform:translateY(-3px)}to{opacity:1;transform:none}}}
@media (max-width:380px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.shadow{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Gym <span>Partner</span></div>
    <div class="row" style="flex-wrap:nowrap;min-width:0"><span class="chip acc" id="weekChip">Week 1</span>
      <button class="micbtn" id="micBtn" type="button" hidden aria-label="Speak an update"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg><span>Speak</span></button></div>
  </header>
  <main id="app"></main>
  <p class="status" id="status">Loading your log…</p>
</div>
<div class="timer" id="timer" hidden><span>Rest</span><span class="num" id="timerNum">1:30</span><button class="btn sm ghost" id="timerSkip" type="button">Skip</button></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-label="Speak an update">
  <div class="sheet-in">
    <div class="row" style="justify-content:space-between"><h2>Speak an update</h2><button class="btn sm ghost" id="sheetClose" type="button">Close</button></div>
    <p class="note">Tap the mic on your keyboard and just talk. Say it the way you'd tell a trainer.</p>
    <textarea id="voiceText" rows="4" placeholder="Chest press 50 kilos, 10 10 9 8 8. Did 30 minutes cardio. Weighed 74.6 this morning, had 2 liters water, finished breakfast and lunch."></textarea>
    <div class="row"><button class="btn" id="voiceGo" type="button">Log it</button><button class="btn ghost" id="voiceStop" type="button" hidden>Stop</button><span class="note" id="voiceState"></span></div>
    <div id="voiceResult" class="stack"></div>
  </div>
</div>
<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="today" aria-current="page">Today</button>
  <button type="button" data-tab="body">Body</button>
  <button type="button" data-tab="diet">Diet</button>
  <button type="button" data-tab="plan">Plan</button>
</nav>

<script>

const DIETS={

    IN_CLAUDE?null:el('div',{class:'stack'},
      el('label',{class:'f'},'Anthropic API key (for voice updates and food estimates)',(()=>{const i=el('input',{type:'password',id:'apiKey',autocomplete:'off',placeholder:'sk-ant-…',value:getKey()});i.addEventListener('change',()=>{try{i.value.trim()?localStorage.setItem(KEY_LS,i.value.trim()):localStorage.removeItem(KEY_LS)}catch(e){}sample=keySample();$('#micBtn').hidden=!sample;render()});return i})()),
      el('p',{class:'note',text:'Stored only in this browser and sent only to Anthropic. Your log is saved on this device, so back it up now and then.'}),
      el('div',{class:'row'},el('button',{class:'btn sm ghost',type:'button',onclick:exportData},'Download backup'),
        (()=>{const f=el('input',{type:'file',id:'importFile',accept:'application/json',hidden:true});f.addEventListener('change',()=>f.files[0]&&importData(f.files[0]));
          return el('span',{},f,el('button',{class:'btn sm ghost',type:'button',onclick:()=>f.click()},'Restore backup'))})()))));
  return v;
}

document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>{ui.tab=b.dataset.tab;render();window.scrollTo(0,0)}));
render();

/* ---------- standalone mode (outside claude.ai) ---------- */
const IN_CLAUDE=!!(window.claude&&window.claude.use);
const KEY_LS='gp-anthropic-key';
function getKey(){try{return localStorage.getItem(KEY_LS)||''}catch(e){return ''}}
function keySample(){
  const key=getKey();if(!key)return null;
  const ask=async(prompt,opts={})=>{
    let res;
    try{res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1500,messages:[{role:'user',content:prompt+'\n\nReply with only the JSON.'}]})})}
    catch(e){throw{code:e&&e.name==='AbortError'?'cancelled':'upstream_error'}}
    if(res.status===401||res.status===403)throw{code:'not_granted'};
    if(res.status===429)throw{code:'rate_limited'};
    if(!res.ok)throw{code:'upstream_error'};
    const j=await res.json();return (j.content||[]).map(c=>c.text||'').join('');
  };
  const f=async(p,o)=>({text:await ask(p,o),truncated:false});
  f.json=async(p,o)=>{const t=await ask(p,o);const m=t.match(/[\[{][\s\S]*[\]}]/);try{return JSON.parse(m?m[0]:t)}catch(e){throw{code:'invalid_json',text:t}}};
  return f;
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='gym-partner-'+today()+'.json';document.body.append(a);a.click();a.remove();
}
function importData(file){
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);COLLS.forEach(k=>{if(d[k]&&typeof d[k]==='object')S[k]=d[k]});cache();render();setStatus('Backup restored')}catch(e){setStatus('That file is not a Gym Partner backup.')}};r.readAsText(file);
}

/* ---------- connect to the shared log ---------- */
(async()=>{
  try{sample=await (window.claude&&window.claude.use?window.claude.use('sample'):null)}catch(e){sample=null}
  if(!sample&&!IN_CLAUDE)sample=keySample();
  if(sample){$('#micBtn').hidden=false;render()}
  try{db=await (window.claude&&window.claude.use?window.claude.use('db'):null)}catch(e){db=null}
  if(!db){setStatus('Saving on this device only.');return}
  setStatus('Synced');
  COLLS.forEach(c=>db.collection(c).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});
    // keep local edits that are still waiting to save
    for(const k in pending){if(k.startsWith(c)){const id=k.slice(c.length);if(S[c][id])m[id]=S[c][id]}}
    S[c]=JSON.parse(JSON.stringify(m));cache();
    const a=document.activeElement;if(!(a&&a.tagName==='INPUT'))render();
  },e=>setStatus('Live sync stopped. Reload to reconnect.')));
})();
</script>
